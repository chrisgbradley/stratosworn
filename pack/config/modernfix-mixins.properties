# Stratosworn: ModernFix mixin toggles shipped with the pack.
# registry_event_progress mixes into NeoForge's GameData.postWithProgressBar. With it on,
# Create's Registrate intermittently throws "Found unused register callbacks" on the client
# when certain addons are present (FTB Quests, Ars Elemancy, Simulated Copycats, Mechanical
# Extruder all reproduced it). The server is unaffected. Cosmetic feature, so it is off.
mixin.feature.registry_event_progress=false
