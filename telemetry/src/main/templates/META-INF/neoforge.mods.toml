modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Christian Bradley"
# Client-only dev tool: never affects server compatibility checks.
displayTest="IGNORE"
description='''
Client-side MCP server (Streamable HTTP on 127.0.0.1) that exposes game telemetry to Claude Code.
Dev-only. Stripped from release builds.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="CLIENT"
